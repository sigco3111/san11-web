// ---------- 지형 생성 (값 노이즈 + 강 + 도시 대지) ----------
function hash(x,y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453; return s - Math.floor(s); }
function smooth(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return hash(xi,yi)*(1-u)*(1-v)+hash(xi+1,yi)*u*(1-v)+hash(xi,yi+1)*(1-u)*v+hash(xi+1,yi+1)*u*v;
}
const CX = N>>1, CY = N>>1;                  // 도시 중심 셀
const H = new Float32Array(N*N);
const FOREST = new Uint8Array(N*N);
const riverX = y => N*0.5 + Math.sin(y*0.32)*3.4 + Math.sin(y*0.11)*2.0;   // 강 곡선
for (let y=0; y<N; y++) for (let x=0; x<N; x++){
  const i = y*N+x;
  let h = smooth(x*0.16, y*0.16)*0.65 + smooth(x*0.05+9, y*0.05+4)*0.35;    // 0..1
  h = Math.floor(h*5.2);                                                     // 단차이
  const dCity = Math.hypot(x-CX, y-CY);
  if (dCity < 3.4) h = 2;                                                    // 도시 대지 평탄
  else if (dCity < 4.6) h = Math.max(1, Math.min(h, 2));
  if (dCity > 5.5 && Math.abs(x - riverX(y)) < 1.15) h = 0;                 // 강바닥 (도시 주변 제외)
  H[i] = h;
  if (h>=2 && dCity>5 && smooth(x*0.3+40, y*0.3+17) > 0.62) FOREST[i]=1;
}

geo.translate(0, 0.5, 0);
const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const terrain = new THREE.InstancedMesh(geo, mat, N*N);
terrain.castShadow = terrain.receiveShadow = true;
const M = new THREE.Matrix4(), C = new THREE.Color();
const grassLo = new THREE.Color(0x6fae4e), grassHi = new THREE.Color(0x4c7d38);
const sand = new THREE.Color(0xc9b380), rock = new THREE.Color(0x8d8f96), bed = new THREE.Color(0x7a6a4d);
let idx = 0;
for (let y=0; y<N; y++) for (let x=0; x<N; x++){
  const i = y*N+x, h = H[i];
  const tall = Math.max(h*STEP, 0.6);
  M.makeScale(1, tall, 1);
  M.setPosition((x-CX)*CELL, 0, (y-CY)*CELL);
  terrain.setMatrixAt(idx, M);
  if (h === 0) C.copy(bed);
  else if (h >= 4) C.copy(rock);
  else {
    C.lerpColors(grassLo, grassHi, (h-1)/3);
    if (h === 1) C.lerp(sand, 0.25);
    C.offsetHSL(0, 0, (hash(x*3,y*7)-0.5)*0.045);
  }
  terrain.setColorAt(idx, C);
  idx++;
}
scene.add(terrain);

// 바닥 테두리(절벽 아래 그림자용 받침)
const base = new THREE.Mesh(new THREE.BoxGeometry(N*CELL+4, 2, N*CELL+4),
  new THREE.MeshLambertMaterial({ color: 0x4a3f2e }));
base.position.y = -1.01; base.receiveShadow = true; scene.add(base);

// 물
const water = new THREE.Mesh(new THREE.PlaneGeometry(N*CELL*1.4, N*CELL*1.4, 1, 1),
  new THREE.MeshPhongMaterial({ color: 0x2e6f9e, transparent:true, opacity:0.82, shininess:140, specular:0x99ccee }));
water.rotation.x = -Math.PI/2; water.position.y = WATER_Y;
scene.add(water);
const water2 = new THREE.Mesh(new THREE.PlaneGeometry(N*CELL*1.4, N*CELL*1.4),
  new THREE.MeshBasicMaterial({ color: 0x9fd4ee, transparent:true, opacity:0.10 }));
water2.rotation.x = -Math.PI/2; water2.position.y = WATER_Y+0.06; scene.add(water2);

// ---------- GLB 로드 ----------
const loader = new GLTFLoader();
const cache = {};
function loadGlb(name){
  if (cache[name]) return cache[name];
  cache[name] = new Promise((res, rej) => loader.load(ASSETS[name], g => res(g.scene), undefined, rej));
  return cache[name];
}
function place(node, x, y, z, s=1, rotY=0){
  const o = node.clone(true);
  o.position.set(x, y, z); o.rotation.y = rotY; o.scale.setScalar(s);
  o.traverse(m => { if (m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
  scene.add(o); return o;
}
const cellTop = (x,y) => H[y*N+x]*STEP;
const wx = x => (x-CX)*CELL, wz = y => (y-CY)*CELL;

// ---------- 숲 ----------
async function buildForest(){
  const names = ["tree_default","tree_default","tree_detailed_dark","tree_cone_dark"];
  const nodes = await Promise.all(names.map(loadGlb));
  const bush = await loadGlb("plant_bush"), grass = await loadGlb("grass_large"), stone = await loadGlb("stone_tallE");
  for (let y=1; y<N-1; y++) for (let x=1; x<N-1; x++){
    const i = y*N+x;
    if (!FOREST[i]) continue;
    const n = 2 + Math.floor(hash(x*7,y*3)*3);
    for (let k=0;k<n;k++){
      const t = nodes[Math.floor(hash(x*5+k, y*11)*nodes.length)];
      place(t, wx(x)+(hash(x+k*9,y)-0.5)*CELL*0.8, cellTop(x,y), wz(y)+(hash(x,y+k*13)-0.5)*CELL*0.8,
            6.4+hash(x*17+k,y*5)*2.2, hash(x+k,y*7+k)*6.28);
    }
  }
  for (let k=0;k<70;k++){
    const x = 1+Math.floor(hash(k,3)*(N-2)), y = 1+Math.floor(hash(k,11)*(N-2)), i=y*N+x;
    if (FOREST[i] || H[i]===0 || Math.hypot(x-CX,y-CY)<4.8) continue;
    place(hash(k,7)>0.5?bush:grass, wx(x)+(hash(k,13)-0.5)*CELL*0.8, cellTop(x,y), wz(y)+(hash(k,19)-0.5)*CELL*0.8, 6.2, hash(k,23)*6.28);
    if (H[i]>=4) place(stone, wx(x), cellTop(x,y), wz(y), 7, hash(k,29)*6.28);
  }
}

// ---------- 성곽 ----------
async function buildCastle(){
  const [wall, gate, tower, flag] = await Promise.all(
    ["wall","gate","towerSquareBaseColor","flagBlueWide"].map(loadGlb));
  const R = 2;                                // 성 반경(셀)
  const y = cellTop(CX, CY);
  for (let d=-R+1; d<=R-1; d++){
    place(wall, wx(CX+d), y, wz(CY-R), 1, 0);                 // 북
    place(wall, wx(CX+d), y, wz(CY+R), 1, Math.PI);           // 남
    place(wall, wx(CX-R), y, wz(CY+d), 1, Math.PI/2);         // 서
    place(wall, wx(CX+R), y, wz(CY+d), 1, -Math.PI/2);        // 동
  }
  place(gate, wx(CX), y, wz(CY+R)+1.2, 1.5, 0);               // 남문
  const ty = y;
  for (const [dx,dz] of [[-R,-R],[R,-R],[-R,R],[R,R]])
    place(tower, wx(CX+dx), ty, wz(CY+dz), 1, (dx+dz)%2 ? Math.PI : 0);
  place(flag, wx(CX-R)+1.2, ty+10.05, wz(CY-R), 1.1, 0);
  place(flag, wx(CX+R)-1.2, ty+10.05, wz(CY-R), 1.1, 0);
  // 성 안의 깃발 하나 더
  place(flag, wx(CX), y+0.1, wz(CY), 1.3, Math.PI/4);
}

// ---------- 도시 라벨 ----------
function label(text, sub){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 160;
  const g = cv.getContext('2d');
  g.font = 'bold 72px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  g.textAlign = 'center'; g.lineWidth = 10; g.strokeStyle = 'rgba(0,0,0,.75)';
  g.strokeText(text, 256, 78); g.fillStyle = '#ffd75e'; g.fillText(text, 256, 78);
  g.font = '44px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  g.strokeText(sub, 256, 138); g.fillStyle = '#fff'; g.fillText(sub, 256, 138);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest:false, transparent:true }));
  sp.scale.set(56, 17.5, 1); sp.renderOrder = 5;
  return sp;
}
const cityLabel = label('진류', '陳留 · 조조군');
cityLabel.position.set(wx(CX), cellTop(CX,CY)+26, wz(CY));
scene.add(cityLabel);

// ---------- 직교 아이소메트릭 카메라 ----------
let az = Math.PI/4;                            // 45°
const EL = Math.atan(1/Math.SQRT2);            // 35.264°
let view = 300, zoom = 2.1;
const cam = new THREE.OrthographicCamera();
const target = new THREE.Vector3(wx(CX), 10, wz(CY)+10);
function updateCam(){
  renderer.setSize(innerWidth, innerHeight);
  const aspect = innerWidth/innerHeight;
  const v = view / zoom;
  cam.left = -v*aspect/2; cam.right = v*aspect/2; cam.top = v/2; cam.bottom = -v/2;
  cam.near = -800; cam.far = 1600;
  const d = 500;
  cam.position.set(
    target.x + Math.sin(az)*Math.cos(EL)*d,
    target.y + Math.sin(EL)*d,
    target.z + Math.cos(az)*Math.cos(EL)*d);
  cam.lookAt(target);
  cam.updateProjectionMatrix();
}
updateCam();

// ---------- 조작 (이동/확대/90° 회전) ----------
let dragging = false, px=0, py=0, pinch=0;
function panBy(dx, dy){
  const s = view/zoom / innerHeight;
  const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,1,0));
  target.addScaledVector(right, -dx*s).addScaledVector(fwd, dy*s);
  target.x = Math.max(-N*CELL*0.5, Math.min(N*CELL*0.5, target.x));
  target.z = Math.max(-N*CELL*0.5, Math.min(N*CELL*0.5, target.z));
  updateCam();
}
canvas.addEventListener('pointerdown', e => { dragging = true; px=e.clientX; py=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if(!dragging) return; panBy(e.clientX-px, e.clientY-py); px=e.clientX; py=e.clientY; });
canvas.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.min(3.4, Math.max(0.45, zoom*(1 - e.deltaY*0.0011))); updateCam(); }, { passive:false });
canvas.addEventListener('touchstart', e => { if (e.touches.length===2) pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }, { passive:true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length===2 && pinch>0){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    zoom = Math.min(3.4, Math.max(0.45, zoom*d/pinch)); pinch = d; updateCam();
  }
}, { passive:true });
function rotate90(dir){
  const from = az, to = az + dir*Math.PI/2, t0 = performance.now();
  (function step(t){ const k = Math.min((t-t0)/260, 1), e = 1-Math.pow(1-k,3);
    az = from + (to-from)*e; updateCam(); if (k<1) requestAnimationFrame(step); })(t0);
}
document.getElementById('rotL').onclick = () => rotate90(-1);
document.getElementById('rotR').onclick = () => rotate90(1);
addEventListener('keydown', e => { if (e.key==='q'||e.key==='Q') rotate90(-1); if (e.key==='e'||e.key==='E') rotate90(1); });
addEventListener('resize', updateCam);

// ---------- 실행 ----------
let t = 0;
(function loop(){
  requestAnimationFrame(loop);
  t += 0.016;
  water.position.y = WATER_Y + Math.sin(t*0.9)*0.07;
  water2.position.y = WATER_Y + 0.06 + Math.sin(t*0.9+1.2)*0.08;
  renderer.render(scene, cam);
})();

Promise.all([buildForest(), buildCastle()])
  .then(() => document.getElementById('load').remove())
  .catch(e => { document.getElementById('load').textContent = '에셋 로드 실패: ' + e; });
</script>
