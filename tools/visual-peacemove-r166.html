<!doctype html><meta charset="utf-8"><title>R166 isolated peace march</title><style>body{background:#181b16;color:#eee;font:18px system-ui;padding:24px}button{font:inherit;padding:10px}pre{white-space:pre-wrap}</style><h1>R166 isolated peace march</h1><p>Explicit unit/peace fixture. Direct stepUnit, not natural diplomacy or real command performance.</p><button id="base">Baseline truce</button><button id="peace">Candidate truce</button><button id="enemy">Candidate enemy</button><pre id="out">Ready</pre><script type="module">
import{Game}from'../js/game.js?v=r166';import{Game as Old}from'https://raw.githack.com/sigco3111/san11-web/819d3ccd5a1c83280a21f37a66bffe4c70c8e9ee/js/game.js';
async function run(kind){const off=Object.fromEntries((await(await fetch('../data/officers670.json')).json()).map(o=>[o.idx,o])),s=await(await fetch('../data/scenario-190.json')).json(),g=new(kind==='base'?Old:Game)(s,off,{},5),c=g.forceCities(5)[0],dst=g.cities.find(c=>c.force!==5&&Math.hypot(c.lon-g.forceCities(5)[0].lon,c.lat-g.forceCities(5)[0].lat)>5);g.econV=1;g.changeRelation(5,0,0);g.diplo[g.diploKey(5,0)].truceUntil=kind==='enemy'?0:30;const u={id:9001,force:5,type:'sword',label:'fixture',officers:[c.officers[0]],troops:5000,qi:100,x:c.lon,z:c.lat,tx:dst.lon,tz:dst.lat,targetCity:dst.id,path:[]},v={...u,id:9002,force:0,x:c.lon+1,tx:null,tz:null,officers:[]};g.units=[u,v];const before=[u.x,u.z];g.stepUnit(u);document.querySelector('#out').textContent=JSON.stringify({fixture:true,kind,peace:g.isPeace(5,0),before,after:[u.x,u.z],moved:Math.hypot(u.x-before[0],u.z-before[1])},null,2)}for(const k of ['base','peace','enemy'])document.getElementById(k).onclick=()=>run(k);
</script>
