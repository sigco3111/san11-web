<!doctype html><meta charset="utf-8"><title>R157 isolated city capture fixture</title><style>body{font:18px system-ui;background:#181810;color:#eee;padding:24px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}table{border-collapse:collapse}td,th{border:1px solid #777;padding:8px}</style><h1>R157 isolated city capture fixture</h1><p>Explicit fixture: city defenders, siege troop, food, target hp and successful capture roll. Real Game.fireTactic, autosave and reload restoration. Not natural gameplay.</p><button id="run">Run siege capture</button><button id="reload">Reload saved result</button><button id="restore">Restore prior separate-game save</button><pre id="out">Loading</pre><script type="module">
import{Game,SAVE_KEY}from'../js/game.js?v=r157';
const previous=localStorage.getItem(SAVE_KEY);if(previous&&!sessionStorage.getItem('r157-backup'))sessionStorage.setItem('r157-backup',previous);
const s=await(await fetch('../data/scenario-184.json')).json(),off=Object.fromEntries((await(await fetch('../data/officers670.json')).json()).map(o=>[o.idx,o])),g=new Game(s,off,{},2);const c=g.cityById[9],att=365,defs=c.officers.slice();const home=g.cityById[8];home.officers=home.officers.filter(i=>i!==att);off[att].state.city=null;off[att].apt=Object.fromEntries(Array.from({length:12},(_,i)=>[i,'S']));c.hp=1;c.troops=100;const u={id:999,force:2,officers:[att],troops:5000,type:'catapult',x:c.lon-1,z:c.lat,path:[],tx:c.lon,tz:c.lat,targetCity:c.id,label:'fixture siege',qi:100,conf:0,food:1234};g.units=[u];const initialFood=c.food;const orig=Math.random;let before={owner:c.force,defenders:defs.map(i=>({i,force:off[i].state.force,status:off[i].state.status})),hp:c.hp,troops:c.troops,food:c.food};function render(x){document.querySelector('#out').textContent=JSON.stringify(x,null,2)}render({before});document.querySelector('#run').onclick=()=>{Math.random=()=>0;const ok=g.fireTactic(999,{type:'city',id:9});Math.random=orig;const saved=JSON.parse(localStorage.getItem(SAVE_KEY));const result={ok,owner:c.force,attackerRemoved:!g.units.some(u=>u.id===999),attackerCity:off[att].state.city,attackerInRoster:c.officers.includes(att),troops:c.troops,food:c.food,foodDelta:c.food-initialFood,defenders:defs.map(i=>({i,status:off[i].state.status,force:off[i].state.force,city:off[i].state.city,captor:off[i].state.captor})),savedOwner:saved.cities.find(c=>c.id===9).force,savedRoster:saved.cities.find(c=>c.id===9).officers,saveAttacker:saved.officerStates[att]};sessionStorage.setItem('r157-result',JSON.stringify(result));render({before,result})};document.querySelector('#restore').onclick=()=>{localStorage.setItem(SAVE_KEY,sessionStorage.getItem('r157-backup'));render({restoredPriorSave:true,turn:JSON.parse(localStorage.getItem(SAVE_KEY)).turn})};document.querySelector('#reload').onclick=()=>location.reload();if(sessionStorage.getItem('r157-result'))render({reloadedSavedResult:JSON.parse
