<!doctype html><meta charset="utf-8"><title>R160 isolated path comparison</title><style>body{font:18px system-ui;background:#141812;color:#eee;padding:24px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style><h1>R160 isolated path comparison</h1><p>Separate in-memory simulation. Seed42,251 scenario,75 turns each. No save writes. Desktop browser timings, not phone performance.</p><button id="run">Compare old and memoized paths</button><pre id="out">Ready</pre><script type="module">
import{Game as Candidate}from'../js/game.js?v=r160';import{aiThink}from'../js/ai.js?v=r160';import{Game as Baseline}from'https://raw.githack.com/sigco3111/san11-web/e75a58f59825cbbf11455c13a0336d54daa89297/js/game.js';
const hash=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(x))))].map(x=>x.toString(16).padStart(2,'0')).join('');document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;document.querySelector('#out').textContent='Running';const scenario=await(await fetch('../data/scenario-251.json')).json(),records=await(await fetch('../data/officers670.json')).json(),skills=await(await fetch('../data/skills.json')).json();let results=[];const originalRandom=Math.random;for(const [label,C]of[['baseline',Baseline],['candidate',Candidate]]){let seed=42;Math.random=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);let off=Object.fromEntries(structuredClone(records).map(o=>[o.idx,o])),g=new C(scenario,off,skills,scenario.forces[0].id);g.delegated=true;g.autosave=()=>{};let paths=[],times=[];let fp=g.findPath.bind(g);g.findPath=(...args)=>{let p=fp(...args);paths.push(p);return p};for(let n=0;n<75&&!g.over;n++){g.pendingDuel=null;g.duel=null;g.pendingDebate=null;g.debate=null;g.pendingDiplo=[];let t=performance.now();g.endTurn(aiThink);times.push(performance.now()-t)}Math.random=originalRandom;let sorted=times.slice().sort((a,b)=>a-b);results.push({label,turn:g.turn,totalMs:Math.round(times.reduce((s,x)=>s+x,0)),p95Ms:Math.round(sorted[Math.floor(sorted.length*.95)]),pathCalls:paths.length,pathHash:await hash(paths),stateHash:await hash({cities:g.cities,forces:g.forces,units:g.units,states:Object.fromEntries(Object.values(off).map(o=>[o.idx,o.state]))})});}document.querySelector('#out').textContent=JSON.stringify({results,samePaths:results[0].pathHash===results[1].pathHash,sameState:results[0].stateHash===results[1].stateHash},null,2);document.querySelector('#run').disabled=false};
</script>
