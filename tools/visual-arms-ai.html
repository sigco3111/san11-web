<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R149 통합 AI 자원 계측</title><style>body{background:#181c20;color:#eee;font:15px sans-serif;margin:24px;line-height:1.6}button{padding:12px;background:#675327;color:white;border:1px solid #bda36a;border-radius:4px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px;border:1px solid #596069;text-align:left}h1{font-size:22px}small{color:#b8c0c8}#status{padding:12px;background:#28332c}section{overflow:auto}</style><h1>R149 통합 AI 자원 계측</h1><p>공개 게임이 아닌 시험 화면입니다. 전체 턴 엔진과 AI를 seed 7로 90턴 실행합니다. 자원·시설은 조작하지 않고 대결 대기만 정리합니다. 실제 앱 플레이·장기 균형 우월성의 증거가 아닙니다.</p><p>저장은 메모리 어댑터로 대조하므로 게임 저장 파일을 변경하지 않습니다.</p><button id="run">통합 시험 실행</button><p id="status">준비</p><section><table><thead><tr><th>실행 턴·도시</th><th>병장</th><th>재고 전→후</th><th>금 전→후</th><th>AP 전→후</th><th>사용턴·저장</th></tr></thead><tbody id="rows"></tbody></table></section><small>검증: 각 명령의 실제 재고 증가량·금/AP 차감·시설 사용턴과 명령 직후 저장 값. 월 수입/출진 등 전체 턴 증감과 혼동하지 않습니다.</small><script type="module">
import{Game}from'../js/game.js?v=r149';import{aiThink}from'../js/ai.js?v=r149';
const [s,oa,skills]=await Promise.all(['scenario-184','officers670','skills'].map(async n=>await(await fetch('../data/'+n+'.json')).json()));
const status=document.getElementById('status'),rows=document.getElementById('rows');
document.getElementById('run').onclick=()=>{rows.innerHTML='';let seed=7;const random=Math.random;Math.random=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);let saved,records=[],g;try{g=new Game(structuredClone(s),Object.fromEntries(structuredClone(oa).map(o=>[o.idx,o])),structuredClone(skills),28);g.delegated=true;
// Test adapter only: serialization into memory, no browser localStorage write.
g.autosave=function(){saved=JSON.parse(JSON.stringify({cities:this.cities,forces:this.forces,turn:this.turn}))};const original=g.produceArms;g.produceArms=function(id,key){const c=this.cityById[id],f=this.forces[c.force],a=this.armsInfo(c,key),b={turn:this.turn,city:c.name_ko,key,stock:c[key],gold:c.gold,ap:f.ap};const ok=original.call(this,id,key);if(ok){const sc=saved.cities.find(c=>c.id===id);const checks=[c[key]-b.stock===a.amount,b.gold-c.gold===a.gold,b.ap-f.ap===a.ap,sc[key]===c[key],sc.gold===c.gold,saved.forces[c.force].ap===f.ap,sc.facilities.some(x=>x.armsUsedTurn===this.turn)];if(!checks.every(Boolean))throw Error('자원/저장 불일치');records.push({...b,afterStock:c[key],afterGold:c.gold,afterAp:f.ap,stamp:a.chosen.armsUsedTurn});}return ok};let tries=0;while(g.turn<=90&&tries++<180){g.pendingDiplos=[];g.pendingDebate=null;g.debate=null;g.pendingDuel=null;g.duel=null;g.endTurn(aiThink)}if(!records.length)throw Error('생산 미발생');rows.innerHTML=records.map(r=>`<tr><td>${r.turn} · ${r.city}</td><td>${r.key}</td><td>${r.stock} → ${r.afterStock}</td><td>${r.gold} → ${r.afterGold}</td><td>${r.ap} → ${r.afterAp}</td><td>${r.stamp} · 일치</td></tr>`).join('');status.textContent=`PASS · ${g.turn-1}턴 실행 · 자연 생산 ${records.length}건 · 자원/직후 저장 전부 일치`;window.fixtureAIResult={turn:g.turn,records};}catch(e){status.textContent='FAIL · '+e.message}finally{Math.random=random}};
</script></html>
